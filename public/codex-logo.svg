<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle with Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="codeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)"/>
  
  <!-- Code Brackets -->
  <g filter="url(#glow)">
    <!-- Left Bracket -->
    <path d="M 180 160 L 140 160 L 140 352 L 180 352" 
          stroke="white" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
    
    <!-- Right Bracket -->
    <path d="M 332 160 L 372 160 L 372 352 L 332 352" 
          stroke="white" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
    
    <!-- Center Code Symbol -->
    <g>
      <!-- Forward Slash -->
      <line x1="280" y1="180" x2="232" y2="332" 
            stroke="url(#codeGradient)" 
            stroke-width="20" 
            stroke-linecap="round"/>
      
      <!-- Less Than -->
      <path d="M 220 220 L 180 256 L 220 292" 
            stroke="url(#codeGradient)" 
            stroke-width="18" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            fill="none"/>
      
      <!-- Greater Than -->
      <path d="M 292 220 L 332 256 L 292 292" 
            stroke="url(#codeGradient)" 
            stroke-width="18" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            fill="none"/>
    </g>
  </g>
  
  <!-- Accent Dots -->
  <circle cx="256" cy="140" r="8" fill="#fbbf24"/>
  <circle cx="256" cy="372" r="8" fill="#fbbf24"/>
  <circle cx="120" cy="256" r="8" fill="#34d399"/>
  <circle cx="392" cy="256" r="8" fill="#34d399"/>
  
  <!-- Text "CODEX" (Optional - can be removed for icon-only version) -->
  <text x="256" y="440" 
        font-family="Arial, sans-serif" 
        font-size="48" 
        font-weight="bold" 
        fill="white" 
        text-anchor="middle">CODEX</text>
</svg>
