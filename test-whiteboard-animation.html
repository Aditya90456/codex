<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whiteboard Animation Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #1e293b;
            color: white;
        }
        canvas {
            border: 2px solid #475569;
            background: white;
            border-radius: 8px;
        }
        .controls {
            margin: 20px 0;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #2563eb;
        }
        button:disabled {
            background: #64748b;
            cursor: not-allowed;
        }
        .info {
            margin: 10px 0;
            padding: 10px;
            background: #374151;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>🎨 Whiteboard Animation Test</h1>
    <p>This tests the animation drawing logic without React.</p>
    
    <div class="controls">
        <button onclick="testBasicDrawing()">Test Basic Drawing</button>
        <button onclick="testAnimation()">Test Animation</button>
        <button onclick="clearCanvas()">Clear Canvas</button>
    </div>
    
    <div class="info" id="info">
        Ready to test...
    </div>
    
    <canvas id="testCanvas" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById('testCanvas');
        const ctx = canvas.getContext('2d');
        const info = document.getElementById('info');
        
        let drawings = [];
        let animationStep = 0;
        let isAnimating = false;

        // Drawing function (same logic as React component)
        function drawShape(ctx, drawing) {
            if (!drawing || !drawing.type) {
                console.warn('Invalid drawing object:', drawing);
                return;
            }

            ctx.strokeStyle = drawing.color || '#3b82f6';
            ctx.lineWidth = drawing.lineWidth || 2;
            ctx.fillStyle = (drawing.color || '#3b82f6') + '20';

            switch (drawing.type) {
                case 'rectangle':
                    if (typeof drawing.startX !== 'number' || typeof drawing.startY !== 'number' ||
                        typeof drawing.endX !== 'number' || typeof drawing.endY !== 'number') {
                        console.warn('Invalid coordinates for rectangle:', drawing);
                        return;
                    }
                    const width = drawing.endX - drawing.startX;
                    const height = drawing.endY - drawing.startY;
                    ctx.strokeRect(drawing.startX, drawing.startY, width, height);
                    ctx.fillRect(drawing.startX, drawing.startY, width, height);
                    break;

                case 'circle':
                    if (typeof drawing.startX !== 'number' || typeof drawing.startY !== 'number' ||
                        typeof drawing.endX !== 'number' || typeof drawing.endY !== 'number') {
                        console.warn('Invalid coordinates for circle:', drawing);
                        return;
                    }
                    const radius = Math.sqrt(
                        Math.pow(drawing.endX - drawing.startX, 2) +
                        Math.pow(drawing.endY - drawing.startY, 2)
                    );
                    if (radius > 0) {
                        ctx.beginPath();
                        ctx.arc(drawing.startX, drawing.startY, radius, 0, 2 * Math.PI);
                        ctx.stroke();
                        ctx.fill();
                    }
                    break;

                case 'text':
                    if (typeof drawing.startX !== 'number' || typeof drawing.startY !== 'number') {
                        console.warn('Invalid coordinates for text:', drawing);
                        return;
                    }
                    ctx.font = `${drawing.fontSize || 16}px Arial`;
                    ctx.fillStyle = drawing.color || '#3b82f6';
                    ctx.fillText(drawing.text || '', drawing.startX, drawing.startY);
                    break;

                case 'arrow':
                    if (typeof drawing.startX !== 'number' || typeof drawing.startY !== 'number' ||
                        typeof drawing.endX !== 'number' || typeof drawing.endY !== 'number') {
                        console.warn('Invalid coordinates for arrow:', drawing);
                        return;
                    }
                    drawArrow(ctx, drawing.startX, drawing.startY, drawing.endX, drawing.endY);
                    break;

                default:
                    console.warn('Unknown drawing type:', drawing.type);
            }
        }

        function drawArrow(ctx, fromX, fromY, toX, toY) {
            const headLength = 15;
            const angle = Math.atan2(toY - fromY, toX - fromX);

            // Draw line
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();

            // Draw arrowhead
            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(
                toX - headLength * Math.cos(angle - Math.PI / 6),
                toY - headLength * Math.sin(angle - Math.PI / 6)
            );
            ctx.moveTo(toX, toY);
            ctx.lineTo(
                toX - headLength * Math.cos(angle + Math.PI / 6),
                toY - headLength * Math.sin(angle + Math.PI / 6)
            );
            ctx.stroke();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawings.forEach((drawing, index) => {
                try {
                    drawShape(ctx, drawing);
                } catch (error) {
                    console.error(`Error drawing shape ${index}:`, error, drawing);
                }
            });
        }

        function testBasicDrawing() {
            info.textContent = 'Testing basic drawing...';
            
            drawings = [
                {type: "rectangle", color: "#3b82f6", startX: 50, startY: 50, endX: 150, endY: 100, lineWidth: 2},
                {type: "text", color: "#000", startX: 70, startY: 80, text: "Rectangle", fontSize: 16},
                {type: "circle", color: "#10b981", startX: 200, startY: 75, endX: 250, endY: 75, lineWidth: 2},
                {type: "text", color: "#10b981", startX: 180, startY: 120, text: "Circle", fontSize: 16},
                {type: "arrow", color: "#ef4444", startX: 300, startY: 50, endX: 400, endY: 100, lineWidth: 2},
                {type: "text", color: "#ef4444", startX: 320, startY: 120, text: "Arrow", fontSize: 16}
            ];
            
            render();
            info.textContent = `✅ Drew ${drawings.length} shapes successfully!`;
        }

        function testAnimation() {
            if (isAnimating) return;
            
            info.textContent = 'Starting animation test...';
            isAnimating = true;
            drawings = [];
            animationStep = 0;
            
            const testAnimation = {
                steps: [
                    {
                        stepNumber: 1,
                        explanation: "Step 1: Initialize array",
                        drawing: [
                            {type: "rectangle", color: "#e5e7eb", startX: 100, startY: 150, endX: 160, endY: 200, lineWidth: 2},
                            {type: "text", color: "#000", startX: 120, startY: 180, text: "2", fontSize: 20},
                            {type: "rectangle", color: "#e5e7eb", startX: 170, startY: 150, endX: 230, endY: 200, lineWidth: 2},
                            {type: "text", color: "#000", startX: 190, startY: 180, text: "7", fontSize: 20}
                        ]
                    },
                    {
                        stepNumber: 2,
                        explanation: "Step 2: Highlight first element",
                        drawing: [
                            {type: "rectangle", color: "#3b82f6", startX: 100, startY: 150, endX: 160, endY: 200, lineWidth: 3},
                            {type: "text", color: "#fff", startX: 120, startY: 180, text: "2", fontSize: 20},
                            {type: "arrow", color: "#ef4444", startX: 130, startY: 210, endX: 130, endY: 240, lineWidth: 2},
                            {type: "text", color: "#ef4444", startX: 140, startY: 235, text: "current", fontSize: 14}
                        ]
                    },
                    {
                        stepNumber: 3,
                        explanation: "Step 3: Found match!",
                        drawing: [
                            {type: "rectangle", color: "#10b981", startX: 100, startY: 150, endX: 160, endY: 200, lineWidth: 3},
                            {type: "text", color: "#fff", startX: 120, startY: 180, text: "2", fontSize: 20},
                            {type: "rectangle", color: "#10b981", startX: 170, startY: 150, endX: 230, endY: 200, lineWidth: 3},
                            {type: "text", color: "#fff", startX: 190, startY: 180, text: "7", fontSize: 20},
                            {type: "text", color: "#10b981", startX: 100, startY: 280, text: "✓ Match found!", fontSize: 18}
                        ]
                    }
                ]
            };
            
            let step = 0;
            const interval = setInterval(() => {
                if (step >= testAnimation.steps.length) {
                    isAnimating = false;
                    clearInterval(interval);
                    info.textContent = '✅ Animation completed successfully!';
                    return;
                }

                const animStep = testAnimation.steps[step];
                info.textContent = `${animStep.explanation} (${step + 1}/${testAnimation.steps.length})`;
                
                if (animStep && animStep.drawing) {
                    const drawingsToAdd = Array.isArray(animStep.drawing) 
                        ? animStep.drawing 
                        : [animStep.drawing];
                    
                    drawingsToAdd.forEach(drawing => {
                        drawings.push(drawing);
                    });
                    
                    render();
                }
                
                step++;
            }, 2000);
        }

        function clearCanvas() {
            drawings = [];
            render();
            info.textContent = 'Canvas cleared.';
        }

        // Initial render
        render();
    </script>
</body>
</html>
