services:
  # Backend API Service (backend folder)
  - type: web
    name: codex-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        fromService:
          type: web
          name: codex-frontend
          property: url
      - key: GEMINI_API_KEY
        sync: false  # Set this manually in Render dashboard with your API key
      - key: CLERK_SECRET_KEY
        sync: false  # Set this manually in Render dashboard for backend Clerk auth
      - key: MONGODB_URI
        sync: false  # Optional - set this manually if you want database
      - key: JWT_SECRET
        generateValue: true
      - key: RATE_LIMIT_MAX
        value: 100

  # Frontend Service
  - type: web
    name: codex-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: codex-backend
          property: url
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false  # Set this manually in Render dashboard
      - key: VITE_APP_NAME
        value: Codex Playground
      - key: VITE_APP_VERSION
        value: 2.0.0