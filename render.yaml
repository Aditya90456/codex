services:
  # Backend API Service
  - type: web
    name: codex-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        fromService:
          type: web
          name: codex-frontend
          property: url
      - key: JWT_SECRET
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: 12
      - key: RATE_LIMIT_POINTS
        value: 100
      - key: RATE_LIMIT_DURATION
        value: 60
      - key: CODE_TIMEOUT
        value: 5000
      - key: MAX_CODE_LENGTH
        value: 10000

  # Frontend Service
  - type: web
    name: codex-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: codex-backend
          property: url
      - key: VITE_APP_NAME
        value: Codex
      - key: VITE_APP_VERSION
        value: 1.0.0